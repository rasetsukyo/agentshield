[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Zero-dependency AI coding agent, MCP server, and prompt-injection security auditor mapped to OWASP Agentic AI Top 10"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rasetsukyo"}
]
keywords = ["security", "mcp", "ai-agents", "prompt-injection", "owasp", "devsecops", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/rasetsukyo/agentshield"
"Pro Pack (PDF/DOCX & Templates)" = "https://rasetsukyo.gumroad.com/l/agentshield"

[project.scripts]
agentshield = "agentshield.__main__:main"

[tool.setuptools.packages.find]
include = ["agentshield*"]
